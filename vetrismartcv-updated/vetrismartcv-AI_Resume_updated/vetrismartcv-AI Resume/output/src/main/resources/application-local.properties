# =============================================
# VetriSmartCV - Local Development Configuration
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

spring.datasource.url=jdbc:h2:file:./data/vetrismartcv-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=false
server.servlet.session.cookie.secure=false
app.base-url=http://localhost:8080
