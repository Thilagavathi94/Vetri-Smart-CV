# =============================================
# VetriSmartCV - Application Configuration
# Render-ready defaults with environment override support
# =============================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Database ----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}



# ---- Thymeleaf ----
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

# ---- Session / Cookies ----
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:2h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

# ---- Logging ----
logging.level.com.vetrismartcv=${LOGGING_LEVEL_COM_VETRISMARTCV:DEBUG}

# ---- Public App URL ----
app.base-url=${APP_BASE_URL:https://vetri-smart-cv.onrender.com}

# ---- Default Admin Account ----
app.admin.name=${APP_ADMIN_NAME:Admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@vetrismartcv.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

# ---- Support / Contact ----
support.phone-display=${SUPPORT_PHONE_DISPLAY:+91 98765 43210}
support.phone-link=${SUPPORT_PHONE_LINK:tel:+919876543210}
support.email=${SUPPORT_EMAIL:support@vetrismartcv.com}
support.address=${SUPPORT_ADDRESS:Chennai, Tamil Nadu, India}
support.map-url=${SUPPORT_MAP_URL:https://maps.google.com/?q=Chennai,Tamil%20Nadu,India}
support.hours=${SUPPORT_HOURS:Mon-Fri, 9am-6pm IST}

# ---- Mail (needed for support acknowledgement and password reset email) ----
# Render can use either SPRING_MAIL_* or common MAIL_/GMAIL_ aliases.
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:${GMAIL_HOST:smtp.gmail.com}}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:${GMAIL_PORT:587}}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${GMAIL_USERNAME:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:${GMAIL_PASSWORD:}}}}
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_FROM:${MAIL_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${GMAIL_USERNAME:}}}}}}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}

# ---- Resend email API fallback (recommended on Render when outbound SMTP times out) ----
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:${APP_MAIL_FROM:${SPRING_MAIL_FROM:${MAIL_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${GMAIL_USERNAME:onboarding@resend.dev}}}}}}}

# =============================================
# OAuth Configuration
# =============================================

# ---- Google OAuth 2.0 Authorization Code Flow ----
# Register your app at https://console.cloud.google.com/
# Add the redirect URI to "Authorized redirect URIs" in your OAuth 2.0 Client.
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/oauth/google/callback}

# ---- LinkedIn OAuth 2.0 ----
oauth.linkedin.client-id=${OAUTH_LINKEDIN_CLIENT_ID:}
oauth.linkedin.client-secret=${OAUTH_LINKEDIN_CLIENT_SECRET:}
oauth.linkedin.redirect-uri=${OAUTH_LINKEDIN_REDIRECT_URI:http://localhost:8080/oauth/linkedin/callback}
