<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetriSmartCV - Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f5f7; color: #1f2937; font-family: "Segoe UI", Arial, sans-serif; }
        .admin-nav {
            background: #4c1d95;
            color: #fff;
            padding: 14px 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .brand { color: #fff; text-decoration: none; font-size: 1.15rem; font-weight: 800; }
        .nav-links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .logout-btn {
            color: #fff;
            text-decoration: none;
            font: inherit;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
        }
        .admin-page { max-width: 1180px; margin: 0 auto; padding: 34px 22px 70px; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 22px;
        }
        .admin-header h1 { margin: 0 0 6px; font-size: 1.8rem; color: #111827; }
        .admin-header p { margin: 0; color: #6b7280; font-size: 14px; }
        .admin-pill {
            background: #ede9fe;
            color: #5b21b6;
            border-radius: 999px;
            padding: 8px 13px;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 17px;
            box-shadow: 0 2px 10px rgba(17,24,39,0.05);
        }
        .stat-label { color: #6b7280; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .stat-value { color: #111827; font-size: 1.7rem; font-weight: 850; margin-top: 5px; }
        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(17,24,39,0.05);
        }
        .panel-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 18px;
            border-bottom: 1px solid #e5e7eb;
            align-items: center;
        }
        .panel-toolbar h2 { margin: 0; font-size: 1.05rem; color: #111827; }
        .search-wrap { display: flex; gap: 10px; min-width: min(100%, 420px); }
        .search-wrap input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            font-size: 14px;
        }
        .primary-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            background: #6d28d9;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #edf0f3; font-size: 14px; vertical-align: middle; }
        th { background: #f9fafb; color: #4b5563; font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
        .user-name { font-weight: 800; color: #111827; }
        .muted { color: #6b7280; font-size: 12px; margin-top: 2px; }
        .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; }
        .badge-role-admin { background: #ede9fe; color: #5b21b6; }
        .badge-role-user { background: #e0f2fe; color: #075985; }
        .badge-plan-free { background: #f3f4f6; color: #374151; }
        .badge-plan-pro { background: #fef3c7; color: #92400e; }
        .badge-plan-premium { background: #dcfce7; color: #166534; }
        select {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 8px 9px;
            background: #fff;
            font: inherit;
            font-size: 13px;
            min-width: 110px;
        }
        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 360px;
            background: #111827;
            color: #fff;
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 12px 30px rgba(17,24,39,0.22);
            display: none;
            z-index: 50;
            font-size: 14px;
        }
        .empty-row { text-align: center; color: #6b7280; padding: 34px 16px; }
        @media (max-width: 900px) {
            .admin-nav, .admin-header, .panel-toolbar { flex-direction: column; align-items: stretch; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .nav-links { justify-content: stretch; }
            .nav-links a, .logout-btn { text-align: center; }
        }
        @media (max-width: 560px) {
            .admin-nav { padding: 14px 18px; }
            .admin-page { padding: 24px 14px 56px; }
            .stats-grid { grid-template-columns: 1fr; }
            .search-wrap { flex-direction: column; }
        }
    </style>
</head>
<body>
<nav class="admin-nav">
    <a href="/" class="brand">VetriSmartCV Admin</a>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/builder">Resume Builder</a>
        <a href="/admin/visitor-analytics">Visitor Analytics</a>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
</nav>

<main class="admin-page">
    <section class="admin-header">
        <div>
            <h1>Admin Panel</h1>
            <p>Manage registered users, roles, and subscription plans.</p>
        </div>
        <div class="admin-pill" th:text="|Signed in as ${userName}|">Signed in as Admin</div>
    </section>

    <section class="stats-grid" aria-label="Admin summary">
        <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="statTotal">0</div></div>
        <div class="stat-card"><div class="stat-label">Admins</div><div class="stat-value" id="statAdmins">0</div></div>
        <div class="stat-card"><div class="stat-label">Free</div><div class="stat-value" id="statFree">0</div></div>
        <div class="stat-card"><div class="stat-label">Pro</div><div class="stat-value" id="statPro">0</div></div>
        <div class="stat-card"><div class="stat-label">Premium</div><div class="stat-value" id="statPremium">0</div></div>
    </section>

    <section class="panel">
        <div class="panel-toolbar">
            <h2>User Management</h2>
            <div class="search-wrap">
                <input id="searchInput" type="search" placeholder="Search by name or email">
                <button class="primary-btn" onclick="loadUsers()">Search</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Subscription</th>
                    <th>Downloads</th>
                    <th>Provider</th>
                    <th>Joined</th>
                    <th>Controls</th>
                </tr>
                </thead>
                <tbody id="usersBody">
                <tr><td colspan="7" class="empty-row">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>

<script>
const plans = ['FREE', 'PRO', 'PREMIUM'];
const roles = ['USER', 'ADMIN'];
let users = [];

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('searchInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') loadUsers();
    });
    loadUsers();
});

async function loadUsers() {
    const q = document.getElementById('searchInput').value.trim();
    const url = q ? `/api/admin/users?q=${encodeURIComponent(q)}` : '/api/admin/users';
    try {
        const res = await fetch(url);
        if (res.status === 403) {
            window.location.href = '/dashboard?accessDenied=admin';
            return;
        }
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Unable to load users.');
        users = data.users || [];
        renderSummary(data.summary || {});
        renderUsers();
    } catch (error) {
        showToast(error.message || 'Unable to load users.', true);
    }
}

function renderSummary(summary) {
    document.getElementById('statTotal').textContent = summary.totalUsers || 0;
    document.getElementById('statAdmins').textContent = summary.admins || 0;
    document.getElementById('statFree').textContent = summary.free || 0;
    document.getElementById('statPro').textContent = summary.pro || 0;
    document.getElementById('statPremium').textContent = summary.premium || 0;
}

function renderUsers() {
    const body = document.getElementById('usersBody');
    if (!users.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty-row">No users found.</td></tr>';
        return;
    }

    body.innerHTML = users.map(user => {
        const role = user.role || 'USER';
        const plan = user.plan || 'FREE';
        return `
            <tr data-id="${user.id}">
                <td>
                    <div class="user-name">${escapeHtml(user.name || 'Unnamed User')}</div>
                    <div class="muted">${escapeHtml(user.email || '')}</div>
                </td>
                <td><span class="badge ${role === 'ADMIN' ? 'badge-role-admin' : 'badge-role-user'}">${role}</span></td>
                <td><span class="badge ${planBadgeClass(plan)}">${plan}</span></td>
                <td>${user.resumeDownloads || 0}</td>
                <td>${escapeHtml(user.provider || 'LOCAL')}</td>
                <td>${formatDate(user.createdAt)}</td>
                <td>
                    <select onchange="updatePlan(${user.id}, this.value)">
                        ${plans.map(p => `<option value="${p}" ${p === plan ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                    <select onchange="updateRole(${user.id}, this.value)" style="margin-left:8px;">
                        ${roles.map(r => `<option value="${r}" ${r === role ? 'selected' : ''}>${r}</option>`).join('')}
                    </select>
                </td>
            </tr>`;
    }).join('');
}

async function updatePlan(id, plan) {
    await patchUser(`/api/admin/users/${id}/plan`, { plan }, 'Subscription updated.');
}

async function updateRole(id, role) {
    await patchUser(`/api/admin/users/${id}/role`, { role }, 'Role updated.');
}

async function patchUser(url, payload, message) {
    try {
        const res = await fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Update failed.');
        showToast(message);
        loadUsers();
    } catch (error) {
        showToast(error.message || 'Update failed.', true);
        loadUsers();
    }
}

function planBadgeClass(plan) {
    if (plan === 'PREMIUM') return 'badge-plan-premium';
    if (plan === 'PRO') return 'badge-plan-pro';
    return 'badge-plan-free';
}

function formatDate(value) {
    if (!value) return '-';
    return new Date(value).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
}

async function doLogout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/';
}

function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.background = isError ? '#dc2626' : '#111827';
    toast.style.display = 'block';
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.style.display = 'none', 3000);
}
</script>
</body>
</html>
