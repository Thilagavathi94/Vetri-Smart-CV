<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetriSmartCV - Upgrade Plan</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #f4f5f7; font-family: 'Segoe UI', sans-serif; }
        .pay-nav { background: #6c3fc9; padding: 14px 50px; display: flex; justify-content: space-between; align-items: center; }
        .pay-nav .logo-text { color: #fff; font-size: 1.2rem; font-weight: 800; text-decoration: none; }
        .pay-nav-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
        .pay-page { max-width: 520px; margin: 60px auto; padding: 0 20px; }
        .pay-card { background: #fff; border-radius: 20px; padding: 40px 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .pay-card h2 { font-size: 1.4rem; font-weight: 800; color: #1a1a2e; margin-bottom: 4px; }
        .pay-card .pay-sub { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
        .plan-sel { display: flex; gap: 12px; margin-bottom: 28px; }
        .plan-opt { flex: 1; border: 2px solid #e5e7eb; border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .plan-opt:hover { border-color: #7c3aed; }
        .plan-opt.selected { border-color: #f59e0b; background: #fffbeb; }
        .plan-opt .plan-name { font-size: 14px; font-weight: 700; color: #1a1a2e; }
        .plan-opt .plan-price { font-size: 1.2rem; font-weight: 800; color: #7c3aed; margin: 4px 0; }
        .plan-opt .plan-price span { font-size: 12px; color: #6b7280; font-weight: 400; }
        .pay-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .pay-btn:hover { opacity: 0.92; }
        .pay-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .secure-note { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 14px; }
        .summary-box { background: #f9fafb; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #374151; padding: 4px 0; }
        .summary-row.total { font-weight: 700; border-top: 1px solid #e5e7eb; padding-top: 10px; margin-top: 6px; }
        .err-msg { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }

        @media (max-width: 1024px) {
            .pay-nav {
                padding: 14px 24px;
                flex-wrap: wrap;
                gap: 14px;
            }
            .pay-nav-actions {
                margin-left: auto;
            }
            .pay-page {
                margin: 40px auto;
            }
        }

        @media (max-width: 768px) {
            .pay-nav {
                padding: 14px 18px;
            }
            .pay-page {
                margin: 24px auto 48px;
                padding: 0 14px;
            }
            .pay-card {
                padding: 28px 22px;
            }
            .plan-sel {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        @media (max-width: 560px) {
            .pay-nav {
                align-items: stretch;
            }
            .pay-nav-actions {
                width: 100%;
                margin-left: 0;
                justify-content: stretch;
                flex-direction: column;
            }
            .pay-nav-actions > * {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
            .summary-row {
                font-size: 13px;
            }
            .pay-btn {
                font-size: 15px;
            }
        }
    </style>
    <script>
    async function doLogout() {
        try { await fetch("/api/auth/logout", { method: "POST" }); } catch(e) {}
        window.location.href = "/";
    }
    function toggleLoginDropdown(e) {
        if (e) e.stopPropagation();
        var wrap = document.getElementById("navLoginWrap");
        if (wrap) wrap.classList.toggle("open");
    }
    document.addEventListener("click", function(e) {
        var wrap = document.getElementById("navLoginWrap");
        if (wrap && !wrap.contains(e.target)) wrap.classList.remove("open");
    });
    </script>
</head>
<body>
<nav class="pay-nav">
    <a href="/" class="logo-text">VetriSmartCV</a>
    <div class="pay-nav-actions">
        <div th:if="${loggedIn}" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border-radius:99px;padding:5px 14px 5px 7px;">
            <div th:text="${userInitial}" style="width:28px;height:28px;background:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;">?</div>
            <span th:text="${userName}" style="color:#fff;font-size:13px;font-weight:600;">User</span>
        </div>
        <button th:if="${loggedIn}" onclick="doLogout()" style="background:transparent;border:1.5px solid rgba(255,255,255,0.4);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;">Logout</button>
        <a href="/pricing" style="color:rgba(255,255,255,0.8);font-size:13px;text-decoration:none;">Back to Pricing</a>
    </div>
</nav>

<div class="pay-page">
    <div class="pay-card">
        <h2>Upgrade Your Plan</h2>
        <p class="pay-sub">Choose a plan and continue securely with Razorpay Checkout.</p>

        <div class="plan-sel">
            <div class="plan-opt selected" id="planPro" onclick="selectPlan('PRO')">
                <div class="plan-name">Pro</div>
                <div class="plan-price">Rs.120 <span>one-time</span></div>
            </div>
            <div class="plan-opt" id="planPremium" onclick="selectPlan('PREMIUM')">
                <div class="plan-name">Premium</div>
                <div class="plan-price">Rs.250 <span>one-time</span></div>
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-row"><span id="summaryPlan">Pro Plan</span><span id="summaryPrice">Rs.120</span></div>
            <div class="summary-row total"><span>Total today</span><span id="summaryTotal">Rs.120</span></div>
        </div>

        <button class="pay-btn" id="payBtn" onclick="processPayment()">Pay Rs.120</button>
        <div class="err-msg" id="payErr"></div>
        <div class="secure-note">Payment details are collected securely by Razorpay.</div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
let selectedPlan = 'PRO';

const params = new URLSearchParams(window.location.search);

function getPlanAmountText(plan) {
    return plan === 'PRO' ? 'Rs.120' : 'Rs.250';
}

function getPlanName(plan) {
    return plan === 'PRO' ? 'Pro Plan' : 'Premium Plan';
}

function setPayButtonText(button) {
    button.textContent = selectedPlan === 'PRO' ? 'Pay Rs.120' : 'Pay Rs.250';
}

function redirectAfterPayment(plan) {
    sessionStorage.setItem('justUpgraded', plan);

    const explicitRedirect = params.get('redirect');
    const storedReviewReturn = sessionStorage.getItem('pendingReviewReturnUrl');

    if (explicitRedirect) {
        const redirectUrl = new URL(explicitRedirect, window.location.origin);
        redirectUrl.searchParams.set('upgraded', '1');
        redirectUrl.searchParams.set('payment', 'success');
        window.location.href = redirectUrl.pathname + redirectUrl.search;
        return;
    }

    if (storedReviewReturn) {
        const redirectUrl = new URL(storedReviewReturn, window.location.origin);
        redirectUrl.searchParams.set('upgraded', '1');
        redirectUrl.searchParams.set('payment', 'success');
        window.location.href = redirectUrl.pathname + redirectUrl.search;
        return;
    }

    const resumeId = sessionStorage.getItem('pendingResumeId') || '';
    if (resumeId) {
        window.location.href = '/review/' + resumeId + '?upgraded=1&payment=success';
    } else {
        window.location.href = '/dashboard?payment=success';
    }
}

function showPaymentError(message) {
    const errEl = document.getElementById('payErr');
    errEl.textContent = message;
    errEl.style.display = 'block';
}

function selectPlan(plan) {
    selectedPlan = plan;

    document
        .getElementById('planPro')
        .classList.toggle(
            'selected',
            plan === 'PRO'
        );

    document
        .getElementById('planPremium')
        .classList.toggle(
            'selected',
            plan === 'PREMIUM'
        );

    document.getElementById('summaryPlan').textContent = getPlanName(plan);
    document.getElementById('summaryPrice').textContent = getPlanAmountText(plan);
    document.getElementById('summaryTotal').textContent = getPlanAmountText(plan);
    setPayButtonText(document.getElementById('payBtn'));
}

async function processPayment() {
    const button = document.getElementById('payBtn');
    const errEl = document.getElementById('payErr');

    errEl.style.display = 'none';
    button.disabled = true;
    button.textContent = 'Preparing payment...';

    try {
        const orderResponse =
            await fetch('/api/payment/create-order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    plan: selectedPlan
                })
            });

        const order = await orderResponse.json();

        if (!order.success) {
            throw new Error(
                order.message || 'Unable to create order'
            );
        }

        const options = {
            key: order.key,
            amount: order.amount,
            currency: order.currency,
            name: 'VetriSmartCV',
            description:
                selectedPlan + ' Plan',
            order_id: order.orderId,
            handler: async function(response) {
                const verifyResponse =
                    await fetch('/api/payment/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify({
                            razorpay_payment_id:
                                response.razorpay_payment_id,
                            razorpay_order_id:
                                response.razorpay_order_id,
                            razorpay_signature:
                                response.razorpay_signature
                        })
                    });

                const result =
                    await verifyResponse.json();

                if (result.success) {
                    redirectAfterPayment(result.plan);
                } else {
                    showPaymentError(
                        result.message ||
                        'Payment verification failed.'
                    );
                }
            },
            modal: {
                ondismiss: function() {
                    button.disabled = false;
                    setPayButtonText(button);
                }
            },
            theme: {
                color: '#6c3fc9'
            }
        };

        const razorpay =
            new Razorpay(options);

        razorpay.on(
            'payment.failed',
            function(response) {
                showPaymentError(
                    'Payment failed: ' +
                    response.error.description
                );
            }
        );

        razorpay.open();

    } catch (error) {
        showPaymentError(error.message);
    } finally {
        button.disabled = false;
        setPayButtonText(button);
    }
}

if (params.get('plan') === 'PREMIUM') {
    selectPlan('PREMIUM');
}
</script>
<script src="/js/navbar.js"></script>
</body>
</html>
