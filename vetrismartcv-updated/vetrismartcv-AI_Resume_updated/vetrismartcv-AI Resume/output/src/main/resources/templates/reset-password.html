<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetriSmartCV - Reset Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f0eefa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Segoe UI", sans-serif;
        }
        .auth-nav {
            background: linear-gradient(135deg, #6c3fc9, #a855f7);
            padding: 14px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 16px rgba(108, 63, 201, 0.18);
        }
        .auth-nav .logo-text {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
        }
        .auth-nav a.home-link {
            color: rgba(255, 255, 255, 0.88);
            font-size: 14px;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 48px rgba(108, 63, 201, 0.14);
            width: 100%;
            max-width: 460px;
            padding: 42px 38px;
        }
        h2 { font-size: 1.75rem; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
        .auth-sub { color: #6b7280; font-size: 14px; margin-bottom: 26px; line-height: 1.55; }
        .form-field { margin-bottom: 18px; }
        .form-field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .form-field input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
        }
        .form-field input:focus {
            border-color: #7c3aed;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 8px 0 16px;
        }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg, .success-msg {
            display: none;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .error-msg { color: #b91c1c; background: #fef2f2; border-left: 3px solid #ef4444; }
        .success-msg { color: #166534; background: #f0fdf4; border-left: 3px solid #22c55e; }
        .back-link { text-align: center; font-size: 13px; color: #6b7280; }
        .back-link a { color: #7c3aed; font-weight: 600; text-decoration: none; }
        @media (max-width: 560px) {
            .auth-nav { padding: 14px 20px; }
            .auth-card { padding: 34px 24px; }
        }
    </style>
</head>
<body>
<nav class="auth-nav">
    <a href="/" class="logo-text">VetriSmartCV</a>
    <a href="/login" class="home-link">Back to Login</a>
</nav>

<main class="auth-page">
    <section class="auth-card">
        <h2>Reset Password</h2>
        <p class="auth-sub">Create a new password for your VetriSmartCV account.</p>

        <input type="hidden" id="resetToken" th:value="${token}">

        <div class="form-field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="6"
                   onkeydown="if(event.key==='Enter') resetPassword()">
        </div>
        <div class="form-field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6"
                   onkeydown="if(event.key==='Enter') resetPassword()">
        </div>

        <div id="resetError" class="error-msg"></div>
        <div id="resetSuccess" class="success-msg"></div>

        <button class="auth-btn" id="resetBtn" onclick="resetPassword()">Update Password</button>
        <p class="back-link">Remembered it? <a href="/login">Back to Login</a></p>
    </section>
</main>

<script>
function showMsg(id, msg) {
    var el = document.getElementById(id);
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}
function hideMsg(id) {
    var el = document.getElementById(id);
    if (el) { el.style.display = 'none'; }
}
async function resetPassword() {
    var token = document.getElementById('resetToken')?.value || '';
    var password = document.getElementById('newPassword')?.value || '';
    var confirm = document.getElementById('confirmPassword')?.value || '';
    var btn = document.getElementById('resetBtn');

    hideMsg('resetError');
    hideMsg('resetSuccess');

    if (!token) {
        showMsg('resetError', 'Reset token is missing. Please use the link from your email.');
        return;
    }
    if (password.length < 6) {
        showMsg('resetError', 'Password must be at least 6 characters long.');
        return;
    }
    if (password !== confirm) {
        showMsg('resetError', 'Passwords do not match.');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating...';
    try {
        var res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: password })
        });
        var data = await res.json().catch(function() { return {}; });
        if (res.ok && data.success) {
            showMsg('resetSuccess', data.message || 'Password reset successfully.');
            setTimeout(function() { window.location.href = '/login'; }, 1300);
        } else {
            showMsg('resetError', data.message || 'Could not reset password. Please request a new link.');
        }
    } catch (err) {
        showMsg('resetError', 'Network error. Please try again.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
    }
}
</script>
</body>
</html>
